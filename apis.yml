name: Virgin Atlantic
kind: company
description: Virgin Atlantic Airways is a United Kingdom long-haul carrier (IATA code
  VS) based at London Heathrow and Manchester, operating a transatlantic joint venture
  with Delta Air Lines, Air France-KLM and SkyTeam, and a SkyTeam member since 2023.
  In the distribution chain it sits as an airline supplier that reaches travel sellers
  through three routes at once - the legacy GDSs (Amadeus, Sabre, Travelport, all
  under renewed multi-year content agreements), its own IATA NDC direct connect, and
  its own consumer channels. Its API posture is distribution-only and honestly gated.
  Virgin Atlantic publishes no consumer, flight-status or loyalty API, and no OpenAPI
  or machine-readable API description of any kind. What it does publish, openly and
  without a login, is the VS NDC Connect portal at ndc.virginatlantic.com - full request
  and response reference documentation for twelve IATA NDC 21.3 messages, XML samples,
  workflow diagrams, a certification programme, and downloadable IATA NDC 21.3.3 XSD
  schema assets. The contract itself is the IATA NDC standard rather than a Virgin-specific
  shape, but getting a key is not self-serve - production access requires valid IATA
  accreditation and Virgin Atlantic ticketing authority (or a service-provider connection),
  a signed Technical User Agreement, Data Processing Agreement and Agency Sales Agreement,
  and at minimum RED tier certification. There is no bulk export operation and no published
  base URL - public docs, accreditation required, no exit path.
