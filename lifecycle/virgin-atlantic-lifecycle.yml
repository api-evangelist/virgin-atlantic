description: >-
  How the Virgin Atlantic NDC API is versioned, released and retired. The airline runs a real,
  dated, public roadmap and a per-release notes system, but the release notes themselves sit behind
  the portal login and there is no public status page, no SLA and no published deprecation policy.
versioning:
  scheme: standard-version
  current: IATA NDC 21.3 (schema assets release 21.3.3, XSD version 9.001, id IATA2021.3)
  mechanism: >-
    The API version is the IATA NDC schema release it implements. There is no version request
    header, no URI version segment and no per-account version pin. Documentation pages carry
    independent page-version stamps and a "Last Updated" date (the 21.3 API Reference index was
    v 12.0, last updated 23 Jul 2026, when probed).
  docs: https://ndc.virginatlantic.com/docs
  previous: >-
    Virgin Atlantic previously certified on the IATA NDC 18.1 standard (first airline to achieve NDC
    Level 3 on 18.1) before moving to 21.3.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  note: >-
    No deprecation policy, notice period, sunset schedule or RFC 8594 Sunset/Deprecation header
    support is published anywhere on VS NDC Connect or the partner hub. The one lifecycle guarantee
    that is published runs the other way - on termination of access "credentials may be revoked or
    rotated; system access may be disabled; APIs and connectivity permissions may be withdrawn"
    (NDC Novation Policy 11.1). No Deprecation pointer is emitted.
  deprecated_operations: []
release_notes:
  url: https://ndc.virginatlantic.com/product-release
  public: false
  note: >-
    The Release Notes page is publicly reachable and renders a Release Id / Environment / Title /
    Release Date table with a date-range filter, but the rows require a portal login to load
    ("No matching Records" anonymously). Release cadence and content are therefore partner-visible,
    not public.
  detail: changelog/virgin-atlantic-changelog.yml
roadmap:
