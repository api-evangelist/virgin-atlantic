actions:
  openapiHarvested: false
  schemasHarvested: true
  asyncapiPath: null
  apisYmlUpdated: true
  reason: >-
    Twelve real, publicly documented NDC messages were listed in apis.yml with
    their documentation, reference, sample and schema properties. No baseURL was
    set on any of them because Virgin Atlantic publishes none. No OpenAPI was
    authored from the XSDs - deriving one would be fabricating a contract Virgin
    Atlantic has not published. The harvested IATA XSDs are stored verbatim in
    schemas/ rather than openapi/ so they are never mistaken for an OpenAPI
    artifact.
