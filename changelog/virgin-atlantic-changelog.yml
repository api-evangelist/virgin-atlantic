  Notes system on VS NDC Connect (public page, login-gated content), a dated public roadmap that
  carries PreLive and Live dates per capability, and a public newsroom for programme-level
  announcements. Only the roadmap and newsroom are readable anonymously, so the structured entries
  below are drawn from those plus the documentation's own page-version stamps. No entry has been
  invented.
scheme: >-
  Named releases with a Release Id, an Environment (PreLive/Live) and a Release Date, filed against
  the IATA NDC 21.3 schema version rather than an API version number of Virgin Atlantic's own.
