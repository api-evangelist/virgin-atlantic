certification:
  docs: https://ndc.virginatlantic.com/certification
  note: >-
    Certification is the promotion path out of test. Three tiers - RED and SILVER are live, GOLD is
    scheduled for February 2026. RED Tier is the minimum for a production key; each tier requires
    submitting sample implementations for its published use cases (RED Cert-1-1 to Cert-1-6, SILVER
    Cert-2-1 to Cert-2-5). An NDC Certification Tool is on the 2026 roadmap.
