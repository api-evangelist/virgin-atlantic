description: >-
  Virgin Atlantic runs a real, publicly documented test surface for its IATA NDC 21.3 APIs. Test
  API keys are issued on portal registration - before, and independently of, the accreditation
  gate on production - and the airline publishes verbatim test credit card numbers, 3DS
  authentication values and test Flying Club (loyalty) card numbers so a seller can exercise the
  full shop-price-book-service flow. Environments are named PreLive and Live on the roadmap.
  Everything recorded here is published anonymously on VS NDC Connect; no value was invented.
environments:
  - name: Test
    key_type: Test API Key
    how_to_get: >-
      Self-serve. Register an organisation on VS NDC Connect
      (https://ndc.virginatlantic.com/account/register), add an IATA or TIDS number, then retrieve
      the test API keys through the NDC API Access journey. Verbatim from the build guide -
      "Please ensure you are registered and have accessed the test API keys."
    base_url: null
    note: No test base URL is published; endpoints are supplied with the key.
  - name: PreLive
    key_type: null
    note: >-
      Named as a distinct pre-production stage on the NDC roadmap, where each capability carries a
      separate "PreLive:" and "Live:" date (for example OrderHistory Phase 1 - PreLive 09/04/2026,
      Live 26/04/2026).
    docs: https://ndc.virginatlantic.com/capability/ndc-roadmap
  - name: Production
    key_type: Production API Key
    how_to_get: >-
      Gated. "To be eligible to apply for a Production API Key, partners must be certified to at
      least RED Tier" - plus valid IATA accreditation and Virgin Atlantic ticketing authority (or an
      approved Service Provider connection), and the signed TUA / DPA / ASA.
    docs: https://ndc.virginatlantic.com/certification
    base_url: null
key_separation:
  mechanism: Separate test and production API keys presented in the same header
  header: 'Ocp-Apim-Subscription-Key: [API-KEY-VALUE]'
  prefixes: null
  note: >-
    Virgin Atlantic does not publish key prefixes (no sk_test_/sk_live_ equivalent); the environment
    is determined by which issued key and endpoint you use.
