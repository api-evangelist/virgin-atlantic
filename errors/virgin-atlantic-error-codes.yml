method: searched
source: https://ndc.virginatlantic.com/docs — the per-message 'Error Response' reference pages on VS NDC
  Connect (one per NDC message), plus the Error and Warning common-type definitions at https://ndc.virginatlantic.com/docs/DataLists/Error
  and https://ndc.virginatlantic.com/docs/DataLists/Warning
description: Published error and warning code registry for the Virgin Atlantic IATA NDC 21.3 API. Virgin
  Atlantic does not use RFC 9457 problem+json; errors are returned inside the IATA NDC XML response as
  repeating <Error> (and <Warning>) elements carrying a PADIS code, a description, and a processing StatusText.
  Codes are documented per message, so the same numeric code can carry different descriptions in different
  messages - every published (message, code, description) row is recorded verbatim below.
format: iata-ndc-xml
rfc9457: false
envelope:
  element: <Error>
  repeating: true
  docs: https://ndc.virginatlantic.com/docs/DataLists/Error
  fields:
  - element: <Code>
    datatype: Alphanumeric
    required: O
    description: PADIS error code based on IATA/PADIS code set 9321
  - element: <DescText>
    datatype: String
    required: O
    description: PADIS error message / Virgin Atlantic custom message
  - element: <LangCode>
    datatype: String
    required: M
    description: By default 'EN'. Virgin Atlantic supports error messages only in English.
  - element: <TagText>
    datatype: String
    required: O
    description: Short description text
  - element: <TypeCode>
    datatype: String
    required: M
    description: 'Processing status code: Not Processed | Processed | Unavailable | Unknown | Retry'
  - element: <URL>
    datatype: String
    required: O
    description: Link for additional information
  warning_element:
    element: <Warning>
    docs: https://ndc.virginatlantic.com/docs/DataLists/Warning
    note: Warnings are returned alongside a processed response (StatusText 'Processed') and do not fail
      the request.
status_text_values:
- NotProcessed
- Processed
- Unavailable
- Unknown
- Retry
mandatory_element_rule:
  code: '912'
  message: Please complete all mandatory fields as per given Specifications
  note: Returned when a mandatory element/attribute defined in the XSD is missing from the request.
auth_error:
  code: '111'
  message: Invalid Agent's IATA API Key
  note: The API-key rejection code; the key is passed in the Ocp-Apim-Subscription-Key header.
